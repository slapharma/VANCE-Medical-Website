name: Lighthouse CI

# Runs Lighthouse against a freshly-built local server on every PR and on
# pushes to main. Reports surface as a check with link to the run; the action
# also uploads HTML reports to temporary public storage and (when run on a PR)
# leaves a summary comment with the scores.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/healthcare-professionals
            http://localhost:3000/legal/privacy
            http://localhost:3000/legal/terms
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
